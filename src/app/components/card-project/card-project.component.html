<div
  class="max-w-lg shadow-lg lg:mt-5 md:mt-8 sm:mt-8 mt-8 bg-card border-radius-card min-h-[40rem] h-auto flex flex-col sm:w-full"
>
  <div class="relative w-full h-auto">
    <!-- Loader -->
    <div
      class="absolute inset-0 flex items-center justify-center bg-white"
      *ngIf="!imageLoaded"
    >
      <div class="flex items-center gap-2 animate-heartbeat">
        <img
          src="../../../assets/icon_laptop.png"
          class="h-8"
          alt="Flowbite Logo"
        />
        <span class="self-center text-2xl font-semibold text-principal">
          Doryan Dev
        </span>
      </div>
    </div>

    <img
      [src]="'assets/Project/' + Pathimg"
      [alt]="Name"
      loading="lazy"
      class="img-card-project w-full h-auto transition-opacity duration-500"
      [class.opacity-0]="!imageLoaded"
      (load)="imageLoaded = true"
    />
  </div>

  <!-- Contenido del card -->
  <div class="flex flex-col justify-between flex-1">
    <div class="px-6 py-4">
      <div
        class="font-bold md:text-2xl lg:text-3xl sm:text-3xl text-2xl mb-2 tittle-card"
      >
        {{ Name }}
      </div>
      <p
        class="mt-3 lg:text-3xl md:text-2xl sm:text-2xl text-2xl subtittle-color subtittle-size"
      >
        Developed for <strong>{{ client }}</strong>
      </p>
      <p class="subtittle-color text-1xl mt-5">
        {{ Description }}
      </p>
    </div>

    <!-- Fila de tecnologías -->
    <div id="row-badges" class="px-6 pt-4 pb-2">
      <ng-container *ngFor="let tech of techs">
        <span
          class="inline-block bg-bage bage-text rounded-full px-3 py-1 text-sm font-semibold tittle-card-tech mr-2 mb-2"
          >{{ tech }}</span
        >
      </ng-container>
    </div>
  </div>
</div>
