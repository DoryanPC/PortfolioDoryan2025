<nav
  #navbar
  class="transition-colors duration-500 bg-transparent border-gray-200 fixed top-0 left-0 w-full z-50 shadow"
>
  <div
    class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
  >
    <a
      href="https://flowbite.com/"
      class="flex items-center space-x-3 rtl:space-x-reverse"
    >
      <img
        src="../../../assets/icon_laptop.png"
        class="h-8"
        alt="Flowbite Logo"
      />
      <!--  <span class="self-center text-2xl font-semibold text-principal"
        >Doryan Dev</span
      > -->
      <p>{{ traducciones?.NavBar[0] }}</p>
    </a>
    <button
      data-collapse-toggle="navbar-default"
      type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
      aria-controls="navbar-default"
      aria-expanded="false"
    >
      <span class="sr-only">Open main menu</span>
      <svg
        class="w-5 h-5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 17 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M1 1h15M1 7h15M1 13h15"
        />
      </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 border rounded-lg md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700"
      >
        <li>
          <a href="#" class="block py-2 px-3 text-navbar" aria-current="page"
            >Experiences</a
          >
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-navbar" aria-current="page"
            >Participations</a
          >
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-navbar" aria-current="page"
            >Contacts</a
          >
        </li>
        <li>
          <div class="relative inline-block text-left">
            <button
              (click)="open = !open"
              class="inline-flex w-full justify-center rounded-md border border-gray-300 bg-navbar px-4 py-2 text-sm text-navbar shadow-sm hover:bg-gray-700"
            >
              <img
                [src]="selectedFlag"
                class="w-5 h-5 mr-2 inline"
                alt="flag"
              />
              {{ selectedLanguage }}
            </button>

            <div
              *ngIf="open"
              class="absolute right-0 z-10 mt-2 w-56 origin-top-right rounded-md bg-navbar shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
            >
              <div class="py-1">
                <button
                  *ngFor="let lang of Languages"
                  (click)="selectLanguage(lang)"
                  class="w-full text-left px-4 py-2 text-sm text-navbar hover:bg-gray-700 flex items-center gap-2"
                >
                  <img [src]="lang.flag" class="w-4 h-4" />
                  {{ lang.name }}
                </button>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
